<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>WORLD&amp;I BookWorld</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#EAECF1; --ink:#1A2030; --ink-2:#4B5367; --ink-3:#7A8296;
  --line:#DCE0E8; --brand:#22306B; --brand-ink:#FFFFFF;
  --rel:#94660F; --phi:#2A6658; --mat:#3748A8; --phy:#A8412B;
  --rel-soft:#F6EEDC; --phi-soft:#E2EFEB; --mat-soft:#E5E8F7; --phy-soft:#F6E5E0;
  --ok:#2A6658; --serif:"Gowun Batang","Noto Serif KR",serif; --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace; --fs:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11141B; --surface:#191E28; --surface-2:#222835; --ink:#E7E9EF; --ink-2:#A9B0C0; --ink-3:#7D8598;
    --line:#2C3342; --brand:#AFC0FF; --brand-ink:#11141B;
    --rel:#D8A64A; --phi:#63B7A2; --mat:#94A3F2; --phy:#E9826A;
    --rel-soft:#2A2416; --phi-soft:#16292532; --mat-soft:#1E2340; --phy-soft:#2E1C18; --ok:#63B7A2;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11141B; --surface:#191E28; --surface-2:#222835; --ink:#E7E9EF; --ink-2:#A9B0C0; --ink-3:#7D8598;
  --line:#2C3342; --brand:#AFC0FF; --brand-ink:#11141B;
  --rel:#D8A64A; --phi:#63B7A2; --mat:#94A3F2; --phy:#E9826A;
  --rel-soft:#2A2416; --phi-soft:#162925; --mat-soft:#1E2340; --phy-soft:#2E1C18; --ok:#63B7A2;
}
html.big{--fs:19px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:1.7;margin:0}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.3;text-wrap:balance;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px}
.label{font-size:.75em;letter-spacing:.08em;font-weight:600;color:var(--ink-3)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.logo{font-family:var(--serif);font-weight:700;font-size:1.25em;text-decoration:none;display:flex;align-items:baseline;gap:8px}
.logo small{font-family:var(--mono);font-size:.55em;color:var(--ink-3);letter-spacing:.06em}
nav.main{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav.main a{text-decoration:none;padding:6px 10px;border-radius:6px;font-size:.9em;color:var(--ink-2)}
nav.main a[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:600}
.tools{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:.88em;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.btn:hover{border-color:var(--ink-3)}

main{padding-block:32px 64px;display:grid;gap:48px}
section{display:grid;gap:20px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:1.5em}

/* hero compass */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2em,5vw,3.1em)}
.hero p{color:var(--ink-2);max-width:34em;margin:12px 0 0}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.compass{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line);border-radius:14px;overflow:hidden;border:1px solid var(--line);position:relative}
.compass a{background:var(--surface);padding:20px 18px 18px;text-decoration:none;display:grid;gap:6px;min-height:150px;transition:background .2s}
.compass a:hover{background:var(--f-soft)}
.compass .fname{font-family:var(--serif);font-size:1.35em;font-weight:700;color:var(--f)}
.compass .fq{font-size:.92em;color:var(--ink-2)}
.compass .fn{font-size:.75em;color:var(--ink-3);margin-top:auto}
.center-i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:1.05em;pointer-events:none;box-shadow:0 0 0 6px var(--bg)}
[data-f="religion"]{--f:var(--rel);--f-soft:var(--rel-soft)}
[data-f="philosophy"]{--f:var(--phi);--f-soft:var(--phi-soft)}
[data-f="math"]{--f:var(--mat);--f-soft:var(--mat-soft)}
[data-f="physics"]{--f:var(--phy);--f-soft:var(--phy-soft)}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step{border-top:2px solid var(--ink);padding-top:14px}
.step b{font-family:var(--serif);font-size:1.15em;display:block}
.step span{color:var(--ink-2);font-size:.93em}
.step .mono{color:var(--ink-3);font-size:.8em}

/* book cards list */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.book{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;text-decoration:none;display:grid;gap:8px;grid-template-rows:auto auto 1fr auto;border-top:3px solid var(--f)}
a.book:hover{border-color:var(--f)}
.book .t{font-family:var(--serif);font-weight:700;font-size:1.08em;line-height:1.35}
.book .a{font-size:.82em;color:var(--ink-3)}
.book .q{font-size:.9em;color:var(--ink-2)}
.book .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:.72em;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.pill.live{background:var(--f-soft);color:var(--f);border-color:transparent;font-weight:600}
.pill.fld{color:var(--f);border-color:var(--f)}
.tag{font-size:.78em;color:var(--ink-3)}
.book.soon{background:transparent;border-style:dashed;border-top-style:solid}

/* hub */
.hub-head{display:grid;gap:10px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.hub-head .fname{color:var(--f);font-family:var(--mono);font-size:.8em;letter-spacing:.1em}
.hub-head h1{font-size:clamp(1.8em,4.5vw,2.6em)}
.hub-head p{color:var(--ink-2);max-width:40em;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.85em;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* card detail */
.crumb{font-size:.85em;color:var(--ink-3)}
.crumb a{color:var(--ink-3)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:start}
.detail article{display:grid;gap:32px;max-width:680px}
.dhead{display:grid;gap:10px}
.dhead h1{font-size:clamp(1.8em,4.5vw,2.5em)}
.qa{background:var(--f-soft);border-radius:12px;padding:22px;display:grid;gap:14px}
.qa .big{font-family:var(--serif);font-size:1.3em;font-weight:700;line-height:1.45}
.qa p{margin:0}
.blk{display:grid;gap:12px}
.blk h2{font-size:1.2em;display:flex;gap:10px;align-items:baseline}
.blk h2 .mono{font-size:.65em;color:var(--f)}
.concepts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.concepts li{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.concepts li:last-child{border-bottom:0}
.concepts .n{font-family:var(--mono);color:var(--f);font-size:.9em}
.concepts b{display:block}
.concepts span{color:var(--ink-2);font-size:.95em}
blockquote.quote{margin:0;border-left:3px solid var(--f);padding:4px 0 4px 18px;font-family:var(--serif);font-size:1.2em;line-height:1.6}
blockquote.quote cite{display:block;font-family:var(--sans);font-style:normal;font-size:.72em;color:var(--ink-3);margin-top:6px}
.prose p{margin:0 0 10px}
.aside{position:sticky;top:90px;display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.video{aspect-ratio:16/9;max-width:100%;border-radius:8px;background:linear-gradient(135deg,var(--f),var(--ink));display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}
.video .play{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.video .play::after{content:"";border-left:14px solid #1A2030;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.video .dur{position:absolute;right:8px;bottom:8px;font-family:var(--mono);font-size:.72em;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:4px}
.vlist{display:grid;gap:6px;font-size:.88em}
.vlist div{display:flex;justify-content:space-between;gap:8px;color:var(--ink-2)}

/* ask me */
.ask{border:2px solid var(--f);border-radius:14px;padding:22px;display:grid;gap:18px;background:var(--surface)}
.ask h2{font-size:1.3em}
.askq{display:grid;gap:8px}
.askq label{font-family:var(--serif);font-weight:700;font-size:1.08em}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);resize:vertical;line-height:1.6}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.check{display:flex;gap:6px;align-items:center;font-size:.85em;color:var(--ink-2)}
.note{font-size:.85em;color:var(--ok);font-weight:500}
.gate{background:var(--surface-2);border-radius:10px;padding:14px;display:grid;gap:10px;font-size:.92em}

/* auth modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,12,20,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal-backdrop[hidden]{display:none}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:14px;width:100%;max-width:360px}
.modal-tabs{display:flex;gap:6px}
.modal-tabs .tab{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;cursor:pointer;font-size:.9em}
.modal-tabs .tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.modal form{display:grid;gap:10px}
.modal input[type="email"],.modal input[type="password"]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.modal .row{justify-content:flex-end}

/* journal */
.timeline{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.entry{position:relative;padding:0 0 26px 24px;display:grid;gap:6px}
.entry::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--f);box-shadow:0 0 0 4px var(--bg)}
.entry .when{font-family:var(--mono);font-size:.78em;color:var(--ink-3)}
.entry .qq{font-family:var(--serif);font-weight:700}
.entry .ans{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;white-space:pre-wrap}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.compare .panel h3{font-size:1em}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stats div b{display:block;font-family:var(--serif);font-size:1.8em;line-height:1.1}
.stats div span{font-size:.8em;color:var(--ink-3)}

/* connections */
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.col{display:grid;gap:10px;align-content:start}
.col h3{font-size:1em;color:var(--f);border-bottom:2px solid var(--f);padding-bottom:6px}
.empty{font-size:.85em;color:var(--ink-3);padding:10px 0}
.feature-intro{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:6px}
.feature-intro h2{font-size:1.4em}
.feature-intro p{margin:0;color:var(--ink-2)}

/* search */
.search input{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:1.05em}

/* vote */
.vote{display:grid;gap:10px}
.vopt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;cursor:pointer;text-align:left}
.vopt[aria-pressed="true"]{border-color:var(--brand)}
.vbar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.vbar i{display:block;height:100%;background:var(--brand)}
.vtop{display:flex;justify-content:space-between;gap:8px}

.news{background:var(--ink);color:var(--bg);border-radius:14px;padding:28px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.news h2{font-size:1.4em}
.news p{margin:6px 0 0;opacity:.8;font-size:.93em}
.news form{display:flex;gap:8px;flex-wrap:wrap}
.news input{padding:10px 12px;border-radius:8px;border:0;min-width:0;width:220px;max-width:100%;background:var(--bg);color:var(--ink)}
.news button{background:var(--bg);color:var(--ink);border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}

footer{border-top:1px solid var(--line);padding-block:24px;font-size:.82em;color:var(--ink-3)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:860px){
  .hero,.detail{grid-template-columns:1fr}
  .aside{position:static}
  .cols{grid-template-columns:1fr 1fr}
  .news{grid-template-columns:1fr}
}
@media (max-width:760px){
  header.top{position:static}
  .bar{gap:10px}
  .logo{flex:1}
  nav.main{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
  nav.main a{white-space:nowrap}
}
@media (max-width:560px){
  .wrap{padding-inline:16px}
  .steps,.compare,.cols{grid-template-columns:1fr}
  .compass a{min-height:130px;padding:16px 14px}
  .center-i{width:52px;height:52px;font-size:.9em}
  main{gap:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap bar">
    <a class="logo" href="#home">WORLD&amp;I <small>BOOKWORLD</small></a>

      <button class="btn" id="bigBtn" aria-pressed="false" title="큰 글씨">가<span style="font-size:1.25em">가</span></button>

    </div>

</header>
<main class="wrap" id="app"></main>
<footer><div class="wrap"><span>WORLD&amp;I (BookWorld)</span><span>기록은 로그인한 계정에 안전하게 저장됩니다</span></div></footer>

<div class="modal-backdrop" id="authOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <div class="modal-tabs" role="tablist" aria-label="가입 또는 로그인">
      <button type="button" class="tab" data-authmode="signup" aria-pressed="true">가입하기</button>

      <label class="sr" for="authEmail" hidden>이메일</label>

      <label class="sr" for="authPassword" hidden>비밀번호</label>
      <input id="authPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="비밀번호 (8자 이상)">

      <div id="authMsg"></div>
      <div class="row"><button type="button" class="btn" id="authCancel">취소</button><button type="submit" class="btn primary">계속하기</button></div>

  </div>
</div>

<script>
const FIELDS={
  religion:{name:"종교",en:"RELIGION",q:"나는 왜 존재하는가",desc:"인류가 수천 년 동안 붙들어 온 초월과 의미의 질문. 특정 전통을 판단하지 않고, 각 종교를 그 신자의 눈으로 읽습니다."},
  philosophy:{name:"철학",en:"PHILOSOPHY",q:"어떻게 살아야 하는가",desc:"소크라테스의 법정에서 오늘의 정의 논쟁까지. 개념어는 내 말로 풀고, 저자가 누구와 싸웠는지 함께 봅니다."},
  math:{name:"수학",en:"MATHEMATICS",q:"무엇이 참인가",desc:"수식 없이 읽는 수학. 한 번 증명되면 영원히 참인 세계가 우리의 생각하는 방식을 어떻게 바꾸는지 따라갑니다."},
  physics:{name:"물리학",en:"PHYSICS",q:"우주는 어떻게 움직이는가",desc:"사고 실험을 그림으로. 시간과 공간, 원자와 우주에 대한 현대 물리학의 그림을 생활의 언어로 옮깁니다."}
};
const FORDER=["religion","philosophy","math","physics"];

const BOOKS=[
 {id:"worlds-religions",f:"religion",t:"세계의 종교",a:"휴스턴 스미스",y:"1991",s:"live",q:"종교들은 얼마나 닮았고 얼마나 다른가?",tags:["진리","죽음","초월"],
  card:{ans:"스미스는 각 종교를 그 신자의 눈으로 보았고, 서로 다른 길이 모두 ‘자기를 넘어서는 삶’을 가리킨다고 읽었다.",
   concepts:[["신자의 눈으로 보기","한 종교를 바깥에서 평가하기 전에, 그 안에서 사는 사람에게 세상이 어떻게 보이는지 먼저 이해한다."],["여러 갈래의 길","힌두교는 지혜·사랑·일·명상이라는 네 가지 요가를 말한다. 사람의 기질에 따라 같은 목적지로 가는 길이 다르다."],["공통의 윤리","거의 모든 전통에 ‘남에게 대접받고 싶은 대로 대접하라’는 황금률과 같은 가르침이 있다."]],
   analogy:"한 산의 정상을 향해 난 여러 등산로. 올라가는 길의 풍경은 서로 다르지만, 높이 오를수록 보이는 하늘은 닮아 간다.",
   quote:"각 종교를 그 종교를 가장 잘 사는 사람의 모습으로 이해하려 해야 한다.",cite:"서문의 요지 · 원고 확정 시 쪽수 기입",
   thought:"공감적 이해는 강력하지만, 종교 간의 실제 차이를 흐린다는 비판도 있다. ‘닮은 점’과 ‘다른 점’을 함께 보는 것이 이 책을 읽는 균형 잡힌 방법이다.",
   links:["axial-age","apology","varieties"],
   ask:["나를 넘어서는 무언가를 느낀 순간이 있었는가? 그때 무엇이 달라졌는가?","나와 다른 신앙을 가진 사람을 그의 눈으로 이해해 본 적이 있는가?"],
   videos:[["본편","14:52"],["쇼츠 · 네 가지 요가","0:58"],["쇼츠 · 황금률","0:47"]]}},
 {id:"axial-age",f:"religion",t:"축의 시대",a:"카렌 암스트롱",y:"2006",s:"live",q:"왜 기원전 800~200년에 위대한 사상이 동시에 태어났나?",tags:["시간","초월","자비"],
  card:{ans:"인류가 폭력과 혼란의 시대를 겪으며, 서로 다른 문명에서 독립적으로 ‘자기중심성을 넘어선 자비’라는 같은 결론에 도달했다.",
   concepts:[["축의 시대","칼 야스퍼스가 이름 붙인 기원전 800~200년경. 공자·노자, 붓다, 히브리 예언자들, 그리스 철학자들이 서로 교류 없이 거의 동시에 인류 사상의 토대를 놓았다."],["교리보다 실천","축의 시대 현자들은 무엇을 믿느냐보다 어떻게 행동하느냐를 중시했다. 자비를 ‘느끼는 것’이 아니라 ‘날마다 실천하는 것’으로 가르쳤다."],["폭력에 대한 응답","이 사상들은 평화로운 시대의 사색이 아니라, 전쟁과 사회 붕괴가 극심했던 시기에 대한 응답으로 태어났다. 고통이 클수록 자비의 가르침이 절실했다."]],
   analogy:"같은 문제를 놓고 따로 떨어진 여러 교실에서 동시에 답을 찾아낸 학생들. 서로 베낄 수 없었는데도 답의 핵심은 놀랍도록 닮아 있었다.",
   quote:"축의 시대의 위대한 현자들이 가르친 것은 형이상학이 아니라 실천적 자비였다.",cite:"서문·결론의 요지 종합 · 원고 확정 시 쪽수 기입",
   thought:"암스트롱은 종교 간 공통점을 자비라는 하나의 틀로 묶는데, 이는 각 전통의 고유한 신학적 차이(신관, 사후관 등)를 다소 평평하게 만든다는 비판을 받는다. ‘닮음’을 강조하는 시각과 ‘차이’를 존중하는 시각을 함께 갖는 것이 균형 잡힌 독서다.",
   links:["worlds-religions","apology","varieties"],
   ask:["나는 나와 다른 신념을 가진 사람의 고통에 얼마나 공감하는가?","자비를 ‘느낌’이 아니라 ‘매일의 실천’으로 바꾼다면, 오늘 나는 무엇을 할 수 있을까?"],
   videos:[["본편","14:10"],["쇼츠 · 동시에 태어난 생각","0:50"]]}},
 {id:"mere-christianity",f:"religion",t:"순전한 기독교",a:"C.S. 루이스",y:"1952",s:"live",q:"이성적인 사람이 신을 믿을 수 있나?",tags:["진리","도덕"],
  card:{ans:"루이스는 인간이면 누구나 느끼는 ‘해야 한다’는 도덕법칙이, 자연을 넘어선 무언가를 가리키는 단서라고 논증했다.",
   concepts:[["도덕법칙 논증","사람들은 다투면서도 ‘그건 불공평해’라는 공통의 기준에 호소한다. 이 보편적인 ‘해야 한다’는 감각이 어디서 왔는지 묻는 것이 루이스 논증의 출발점이다."],["삼중 선택(주·거짓말쟁이·광인)","예수가 스스로를 신이라 말했다는 기록을 진지하게 받아들인다면, 그는 참으로 신이거나, 거짓말쟁이거나, 미치광이여야 한다 — ‘위대한 도덕 선생’이라는 중간 지대는 없다는 것이 루이스의 유명한 논증이다."],["자연 너머를 가리키는 갈망","무엇으로도 완전히 채워지지 않는 갈망이 있다면, 그것은 이 세상이 그 갈망을 채우도록 만들어지지 않았다는 단서일 수 있다."]],
   analogy:"물고기가 물을 낯설어하지 않듯, 이 세상에 완벽히 맞는 존재라면 ‘더 나은 곳’을 갈망하지 않을 것이다. 채워지지 않는 갈망은 다른 세계가 있다는 단서다.",
   quote:"이 세상 어떤 경험으로도 채워지지 않는 갈망이 내 안에 있다면, 가장 그럴듯한 설명은 내가 다른 세계를 위해 만들어졌다는 것이다.",cite:"3권 10장 「소망」",
   thought:"루이스의 삼중 선택 논증은 ‘위대한 도덕 선생’이라는 중간항이 실제로 불가능한지에 대해 여전히 논쟁적이다. 신화·비유로 예수를 이해하려는 이들에게는 논증이 너무 이분법적으로 느껴질 수 있다. 논증이 강력한 만큼, 그 전제를 스스로 검토하며 읽는 것이 중요하다.",
   links:["worlds-religions","apology","varieties"],
   ask:["나는 ‘이건 옳고 저건 그르다’는 판단을 어디서 배웠다고 생각하는가?","무엇으로도 완전히 채워지지 않는 나만의 갈망이 있다면, 그것은 무엇인가?"],
   videos:[["본편","15:40"],["쇼츠 · 삼중 선택","0:55"]]}},
 {id:"varieties",f:"religion",t:"종교적 경험의 다양성",a:"윌리엄 제임스",y:"1902",s:"live",q:"신비 체험은 뇌의 착각인가, 실재인가?",tags:["의식","초월"],
  card:{ans:"제임스는 신비 체험이 뇌에서 일어난다는 사실이 그 체험의 가치를 부정하지 않는다며, 체험을 ‘기원’이 아니라 ‘삶에 남긴 열매’로 판단하자고 제안했다.",
   concepts:[["의료유물론 비판","‘환상은 뇌 상태일 뿐이다’라는 식의 설명은 모든 생각에 똑같이 적용된다 — 이성적 확신도 뇌 상태이긴 마찬가지다. 기원이 물질적이라는 사실만으로 그 내용이 거짓이 되지는 않는다."],["열매로 판단하기","한 체험이 참인지보다, 그 체험이 그 사람의 삶을 더 너그럽고 담대하게 바꾸었는지를 보라는 것이 제임스의 실용주의적 제안이다."],["건강한 마음과 병든 영혼","세상을 낙관으로 보는 ‘한 번 태어난’ 사람과, 고통을 통과해야 신앙에 이르는 ‘두 번 태어난’ 사람 — 종교적 기질은 하나가 아니라 여럿이다."]],
   analogy:"사과나무가 뿌리에서 양분을 끌어올린다고 해서 사과의 맛이 가짜가 되지 않는다. 체험의 뿌리(뇌)와 체험의 열매(삶에 남긴 변화)는 다른 질문이다.",
   quote:"종교적 체험이 낳은 최선의 열매는, 역사가 보여줄 수 있는 최선의 것들이다.",cite:"결론 장의 요지 · 원고 확정 시 쪽수 기입",
   thought:"‘열매로 판단하라’는 기준은 매력적이지만, 무엇을 ‘좋은 열매’로 볼지는 결국 판단하는 사람의 가치관에 달려 있다는 순환의 문제가 남는다. 그럼에도 체험을 무조건 미신으로도, 무조건 진리로도 몰지 않는 이 태도는 여전히 유용하다.",
   links:["worlds-religions","axial-age","seven-lessons"],
   ask:["내가 겪은 강렬한 경험(종교적이든 아니든) 중, 그 이후 삶을 실제로 바꾼 것은 무엇인가?","나는 어떤 믿음을 ‘그것이 사실이어서’가 아니라 ‘그것이 나를 더 낫게 만들어서’ 붙들고 있는가?"],
   videos:[["본편","13:55"],["쇼츠 · 열매로 판단하기","0:48"]]}},

 {id:"apology",f:"philosophy",t:"소크라테스의 변론",a:"플라톤",y:"기원전 4세기",s:"live",q:"왜 소크라테스는 도망치지 않았나?",tags:["진리","죽음","양심"],
  card:{ans:"소크라테스에게 목숨보다 중요한 것은 ‘영혼을 돌보는 삶’, 곧 자신의 무지를 알고 끝까지 캐묻는 삶이었다.",
   concepts:[["무지의 앎","지혜로운 사람은 많이 아는 사람이 아니라, 자신이 모른다는 사실을 아는 사람이다."],["영혼의 돌봄","재산과 명예보다 영혼을 훌륭하게 만드는 일에 먼저 마음을 써야 한다."],["내면의 목소리","잘못된 일을 하려 할 때 멈추게 하는 소리. 오늘날 우리가 ‘양심’이라 부르는 것과 닮았다."]],
   analogy:"소크라테스는 자신을 아테네라는 크고 둔한 말을 깨우는 등에라고 불렀다. 따끔하지만, 그 덕에 말은 잠들지 않는다.",
   quote:"음미하지 않는 삶은 인간에게 살 가치가 없다.",cite:"플라톤, 『소크라테스의 변론』 38a",
   thought:"끝없이 캐묻는 태도는 공동체를 불편하게 만든다. 오늘날의 온라인 논쟁과 비교하면, 소크라테스의 질문은 상대를 이기려는 것이 아니라 함께 진리에 가까워지려는 것이었다는 점이 다르다.",
   links:["problems-of-philosophy","justice","geb"],
   ask:["나는 손해를 감수하고 옳음을 지킨 적이 있는가?","요즘 내가 ‘안다’고 착각하고 있는 것은 무엇인가?"],
   videos:[["본편","15:20"],["쇼츠 · 등에의 비유","0:52"],["쇼츠 · 음미하는 삶","0:41"]]}},
 {id:"problems-of-philosophy",f:"philosophy",t:"철학의 문제들",a:"버트런드 러셀",y:"1912",s:"live",q:"내 앞의 책상은 정말 있는가?",tags:["실재","진리"],
  card:{ans:"러셀은 우리가 직접 아는 것은 ‘감각자료’(색, 모양 등 인상)뿐이며, 그 뒤에 있다고 ‘추론’하는 물리적 책상 자체는 확실성의 문제로 남는다고 보았다.",
   concepts:[["감각자료와 물리적 대상","같은 책상도 보는 각도·조명에 따라 다른 색과 모양으로 보인다. 우리가 직접 아는 건 이 인상(감각자료)이고, ‘책상 그 자체’는 그로부터 추론된 것이다."],["귀납의 문제","해가 매일 떠올랐다고 해서 내일도 뜬다는 게 논리적으로 보장되지는 않는다. 과거의 반복만으로 미래를 확신하는 추론에는 근본적인 빈틈이 있다."],["철학의 가치","철학은 확실한 답을 주기보다 ‘당연하다고 믿던 것’에 의문을 던져, 우리 사고를 더 크고 자유롭게 만든다는 것이 마지막 장의 결론이다."]],
   analogy:"무대 뒤 배우를 직접 본 적은 없고, 무대에 비치는 조명과 그림자로만 그 존재를 짐작하는 관객. 우리가 ‘아는’ 것은 언제나 그 그림자 쪽에 더 가깝다.",
   quote:"철학의 가치는 그것이 제기하는 물음들의 불확실성 자체에 상당 부분 있다.",cite:"마지막 장 「철학의 가치」의 요지 · 원고 확정 시 쪽수 기입",
   thought:"감각자료 이론은 이후 철학에서 많은 비판을 받았고(예: ‘감각자료’ 자체가 불필요한 개념이라는 반론), 러셀 스스로도 후기에 입장을 바꾸었다. 하지만 ‘당연한 것’을 의심하는 훈련으로서 이 책의 가치는 여전하다.",
   links:["apology","sophie","geb"],
   ask:["내가 ‘확실히 안다’고 믿는 것 중, 사실은 습관적으로 추론해 온 것은 무엇인가?","의문을 갖는 것 자체가 나를 더 자유롭게 만든 경험이 있는가?"],
   videos:[["본편","14:35"],["쇼츠 · 감각자료","0:50"]]}},
 {id:"sophie",f:"philosophy",t:"소피의 세계",a:"요슈타인 가아더",y:"1991",s:"live",q:"철학 2500년을 이야기로 어떻게 엮나?",tags:["실재","시간"],
  card:{ans:"가아더는 소크라테스 이전 철학자부터 사르트르까지의 역사를, 소피라는 소녀가 정체불명의 편지로 배우는 추리소설 형식에 담아 ‘철학하는 경험’ 자체를 이야기로 만들었다.",
   concepts:[["토끼의 흰 털 위에서 살기","우리는 우주라는 거대한 토끼의 털 깊숙한 곳에서 태어나, 그것을 당연하게 여기며 산다. 철학자는 그 털을 타고 토끼의 눈까지 기어올라가 세상을 낯설게 보려는 사람이다."],["액자 속의 액자","소설 후반, 소피는 자신이 다른 인물이 딸을 위해 쓰고 있는 책 속 인물이라는 사실을 알게 된다. 이는 ‘우리도 누군가의 이야기 속에 있는 건 아닐까’라는 질문을 소설 구조 자체로 체험하게 한다."],["역사를 관통하는 하나의 질문","탈레스의 ‘만물의 근원은 무엇인가’부터 사르트르의 실존주의까지, 시대마다 답은 달라도 ‘나는 누구이고 세계는 무엇인가’라는 질문 자체는 이어진다."]],
   analogy:"마술사가 모자에서 토끼를 꺼내면 아이들은 놀라지만, 자라면서 그 놀라움을 잊는다. 철학은 다 자란 뒤에도 ‘어떻게 토끼가 거기서 나왔지?’를 계속 묻는 능력이다.",
   quote:"철학자에게 당연한 것은 하나도 없다. 모든 것이 놀랍다.",cite:"1장 「에덴동산」의 요지 · 원고 확정 시 쪽수 기입",
   thought:"소설 형식 덕에 철학사가 쉽게 읽히지만, 방대한 2500년을 한 권에 압축하며 각 사상가의 입장이 단순화된 부분도 있다. 입문으로 삼되, 흥미를 느낀 사상가는 원전으로 더 들어가 보는 것이 좋다.",
   links:["apology","problems-of-philosophy","seven-lessons"],
   ask:["내가 ‘당연하다’고 여겨서 한 번도 의심해 본 적 없는 것은 무엇인가?","만약 내 삶이 누군가 쓰고 있는 이야기라면, 지금 이 장면에서 나는 어떤 인물일까?"],
   videos:[["본편","16:20"],["쇼츠 · 토끼의 털","0:52"]]}},
 {id:"justice",f:"philosophy",t:"정의란 무엇인가",a:"마이클 샌델",y:"2009",s:"live",q:"다섯을 살리려 한 명을 희생해도 되나?",tags:["도덕","자유의지"],
  card:{ans:"샌델은 정의를 ‘최대 다수의 행복’(공리주의), ‘개인의 자유와 권리’(자유지상주의), ‘공동체가 함께 정한 좋은 삶’(공동체주의) 세 가지 다른 렌즈로 비교하며, 정답보다 ‘어떻게 생각할지’를 훈련시킨다.",
   concepts:[["트롤리 문제","브레이크 없는 전차가 다섯 명 쪽으로 가고 있다. 선로를 바꿔 한 명을 죽이고 다섯을 살릴 것인가? 같은 숫자 계산인데도, 직접 손으로 미는 상황이 되면 사람들의 판단이 달라진다 — 결과만으로는 설명 안 되는 도덕적 직관이 있다는 뜻이다."],["공리주의와 그 한계","벤담의 ‘최대 다수의 최대 행복’은 명료하지만, 소수의 권리를 다수의 이익을 위해 희생해도 되는가라는 문제에 부딪힌다."],["자유지상주의: 나는 나의 소유자인가","노직 등은 타인에게 해를 끼치지 않는 한 내 몸과 재산은 온전히 내 것이라 주장한다. 그렇다면 자발적 노예 계약이나 장기 매매도 허용해야 하는가라는 질문이 뒤따른다."]],
   analogy:"세 개의 다른 안경. 공리주의 안경을 쓰면 총합이 보이고, 자유지상주의 안경을 쓰면 개인의 경계선이 보이고, 공동체주의 안경을 쓰면 우리가 함께 무엇을 좋은 삶이라 부르는지가 보인다. 같은 사건도 안경에 따라 다르게 읽힌다.",
   quote:"정의로운 사회를 이루려면 좋은 삶의 의미를 함께 고민해야 한다. 그리고 이는 필연적으로 시민들 사이의 도덕적, 심지어 종교적인 이견을 초래할 수밖에 없다.",cite:"결론 「정의와 좋은 삶」의 요지 · 원고 확정 시 쪽수 기입",
   thought:"샌델은 자신이 지지하는 공동체주의적 입장을 은근히 드러내면서도, 각 입장의 강점을 공정하게 소개하려 애쓴다. 다만 ‘가치중립’을 표방하는 자유주의 사회에서 특정 ‘좋은 삶’을 합의하는 일이 현실적으로 가능한지는 여전히 논쟁적이다.",
   links:["apology","problems-of-philosophy","varieties"],
   ask:["나는 지금까지 어떤 도덕적 판단을, 결과가 아니라 ‘그냥 옳지 않아서’ 내린 적이 있는가?","내가 속한 공동체가 ‘좋은 삶’이라고 암묵적으로 합의한 것은 무엇이고, 나는 거기에 동의하는가?"],
   videos:[["본편","17:05"],["쇼츠 · 트롤리 문제","0:58"],["쇼츠 · 세 개의 안경","0:47"]]}},

 {id:"fermat",f:"math",t:"페르마의 마지막 정리",a:"사이먼 싱",y:"1997",s:"live",q:"358년 동안 아무도 못 푼 문제는 어떻게 풀렸나?",tags:["증명","무한"],
  card:{ans:"앤드루 와일스는 7년 동안 홀로 연구해 타원곡선과 모듈러 형식을 잇는 다리를 증명했고, 페르마의 정리는 그 다리 위에서 따라 나왔다.",
   concepts:[["페르마의 마지막 정리","n이 3 이상이면 xⁿ + yⁿ = zⁿ을 만족하는 자연수 x, y, z는 없다. 문장은 중학생도 이해하지만 증명은 358년이 걸렸다."],["증명이라는 약속","과학 이론은 새 실험으로 바뀔 수 있지만, 수학의 증명은 한 번 완성되면 영원히 참이다."],["서로 다른 세계 잇기","전혀 관계없어 보이던 두 수학 분야가 사실 같은 것을 말하고 있었다는 추측(다니야마–시무라)이 열쇠였다."]],
   analogy:"두 나라 말을 잇는 사전 한 권. 한쪽 언어로 풀 수 없던 문제를 다른 언어로 옮기자 답이 보였다.",
   quote:"나는 이 명제에 대한 놀라운 증명을 발견했지만, 여백이 너무 좁아 여기에 적지 않는다.",cite:"피에르 드 페르마가 책 여백에 남긴 메모 (1637년경)",
   thought:"1993년 발표된 증명에서 오류가 발견되었고, 와일스는 1년 넘게 고친 끝에 완성했다. 이 책의 진짜 주제는 천재성보다 실패를 견디는 끈기일지 모른다.",
   links:["x-joy","geb","brief-history"],
   ask:["나는 몇 년이 걸려도 붙잡고 싶은 문제가 있는가?","내 계획에서 오류를 발견했을 때 나는 어떻게 반응하는가?"],
   videos:[["본편","16:05"],["쇼츠 · 여백의 메모","0:55"]]}},
 {id:"x-joy",f:"math",t:"X의 즐거움",a:"스티븐 스트로가츠",y:"2012",s:"live",q:"수학은 왜 세상을 설명하는 데 쓸모가 있나?",tags:["무한","실재"],
  card:{ans:"스트로가츠는 수학이 실제 세계에서 반복되는 ‘패턴’을 뽑아내는 언어이기 때문에, 그 패턴이 통하는 곳이면 어디든 예측력을 발휘한다고 설명한다.",
   concepts:[["숫자는 추상화된 패턴","사과 세 개와 양 세 마리는 다르지만 둘 다 ‘3’이라는 패턴을 공유한다. 이 추상화 덕분에 한 번 배운 산수를 완전히 다른 상황에 재사용할 수 있다."],["미적분의 핵심 통찰","순간의 기울기(변화율)와 누적된 넓이(총량)가 사실은 서로의 역연산이라는 것 — 미적분의 기본정리는 ‘지금 얼마나 빠른가’와 ‘지금까지 얼마나 쌓였나’를 잇는 다리다."],["0.999...=1의 역설","0.999...를 무한히 쓰면, 이는 1과 다른 수가 아니라 정확히 1과 같다. 무한을 끝까지 밀어붙이면 직관과 다른 결론이 논리적으로 참이 된다."]],
   analogy:"지도는 실제 땅이 아니지만, 지도 위의 관계(거리, 방향)가 실제 땅의 관계와 같은 구조를 가지기 때문에 쓸모 있다. 수학도 세계 자체는 아니지만, 세계와 같은 구조를 가진 지도다.",
   quote:"수학은 패턴의 과학이다.",cite:"서문의 요지 · 원고 확정 시 쪽수 기입",
   thought:"이 책은 수학을 어렵지 않게 느끼도록 비유를 적극적으로 쓰는데, 비유가 매끄러운 만큼 엄밀한 정의와는 거리가 있는 설명도 있다. 흥미를 붙이는 입문서로 읽고, 더 깊이 알고 싶은 개념은 정식 교재로 확인하는 게 좋다.",
   links:["fermat","17-equations","geb"],
   ask:["내 일상에서 반복되는 ‘패턴’을 발견하고 그것을 이용해 본 적이 있는가?","나는 ‘정확히 맞지는 않지만 쓸모 있는 설명’과 ‘완전히 엄밀하지만 이해하기 어려운 설명’ 중 어느 쪽을 더 신뢰하는가, 그 이유는?"],
   videos:[["본편","15:15"],["쇼츠 · 0.999...=1","0:56"]]}},
 {id:"17-equations",f:"math",t:"세상을 바꾼 17가지 방정식",a:"이언 스튜어트",y:"2012",s:"live",q:"식 하나가 어떻게 역사를 바꿨나?",tags:["우주","증명"],
  card:{ans:"스튜어트는 피타고라스 정리부터 슈뢰딩거 방정식까지, 짧은 수식 하나가 항해·통신·의학·우주여행처럼 전혀 다른 영역의 역사를 바꾼 과정을 추적한다.",
   concepts:[["짧은 식, 긴 파장","맥스웰 방정식 네 줄은 전자기학을 통합했을 뿐 아니라, 빛이 전자기파임을 예측해 라디오·와이파이 시대를 열었다. 식의 길이와 그 영향력은 비례하지 않는다."],["방정식은 압축된 관찰","뉴턴의 중력 법칙은 사과의 낙하와 행성의 공전이 같은 하나의 규칙을 따른다는 압축된 진술이다. 서로 달라 보이는 현상을 하나의 식으로 묶는 것이 방정식의 힘이다."],["방정식의 이중적 유산","E=mc²은 원자력 발전과 원자폭탄을 동시에 가능하게 했다. 하나의 식이 세상을 바꾸는 방향은 좋을 수도, 나쁠 수도 있다."]],
   analogy:"짧은 악보 한 줄이 오케스트라 전체의 연주를 지시하듯, 몇 개의 기호로 압축된 방정식이 자연 전체의 움직임을 지시한다.",
   quote:"방정식은 자연이 우리에게 속삭이는 비밀이다.",cite:"서문의 요지 · 원고 확정 시 쪽수 기입",
   thought:"이 책은 방정식의 ‘성공 사례’ 위주로 서술되어, 같은 시대에 틀렸거나 폐기된 다른 방정식들의 이야기는 상대적으로 적다. 과학사가 성공만으로 이루어지지 않았다는 점을 함께 기억하며 읽으면 좋다.",
   links:["fermat","x-joy","brief-history"],
   ask:["내 전공이나 일 속에 숨어 있는 ‘단순하지만 강력한 규칙’은 무엇인가?","기술이 좋은 목적과 나쁜 목적 모두에 쓰일 수 있다는 걸 알면서도, 나는 그 기술을 계속 배우고 써야 한다고 생각하는가?"],
   videos:[["본편","16:40"],["쇼츠 · 맥스웰 방정식","0:53"]]}},
 {id:"geb",f:"math",t:"괴델, 에셔, 바흐",a:"더글러스 호프스태터",y:"1979",s:"live",q:"수학에도 증명할 수 없는 참이 있나?",tags:["증명","의식","무한","진리"],
  card:{ans:"괴델은 충분히 강력한 수학 체계라면, 그 체계 안의 규칙만으로는 참인지 거짓인지 증명할 수 없는 문장이 반드시 존재한다는 것을 증명했다 — 수학조차 스스로를 완전히 증명할 수 없다.",
   concepts:[["불완전성 정리","‘이 문장은 이 체계 안에서 증명될 수 없다’는 자기 지시적 문장을 수 체계 안에 구성할 수 있다. 이 문장이 참이면 증명 불가능한 참이 존재하고, 거짓이면 체계가 모순이다 — 어느 쪽이든 체계는 ‘완전하고 무모순’일 수 없다."],["이상한 고리(strange loop)","위로, 위로 올라가다 보면 결국 출발점으로 되돌아오는 구조. 에셔의 오르내리는 계단 그림, 바흐의 무한히 상승하는 카논, 괴델의 자기 지시 문장은 모두 같은 형태의 고리다."],["의식은 고리에서 나오는가","호프스태터는 ‘나’라는 자아감각도 뇌가 자기 자신을 표상하는 이상한 고리에서 창발한다고 추측한다 — 마음도 일종의 괴델식 자기 지시 구조일 수 있다는 것이다."]],
   analogy:"거울 두 개를 마주 세우면 그 사이에 무한히 이어지는 반사상이 생긴다. 체계가 자기 자신을 비추기 시작하면, 그 체계는 스스로를 완전히 담을 수 없는 무한한 되비침에 빠진다.",
   quote:"이상한 고리란, 계층 구조를 따라 위로(또는 아래로) 움직이다가 뜻밖에도 출발했던 그 자리로 되돌아오게 되는 현상이다.",cite:"서론 「하나의 유설적 서곡」요지 · 원고 확정 시 쪽수 기입",
   thought:"이 책은 방대하고 유희적이라 핵심 논증(불완전성 정리)과 저자의 사변(의식이 고리에서 나온다는 가설)이 뒤섞여 읽힌다. 괴델의 수학적 증명 자체는 확립된 사실이지만, 그것을 의식·AI로 확장하는 해석은 여전히 저자 개인의 추측임을 구분해서 읽을 필요가 있다.",
   links:["fermat","apology","seven-lessons"],
   ask:["나는 스스로를 완전히 설명할 수 있다고 생각하는가, 아니면 나 자신도 다 담아낼 수 없는 부분이 있다고 느끼는가?","모든 것을 증명하거나 통제할 수 없다는 사실이 나를 불안하게 하는가, 자유롭게 하는가?"],
   videos:[["본편","17:30"],["쇼츠 · 이상한 고리","0:58"],["쇼츠 · 불완전성 정리","0:55"]]}},

 {id:"seven-lessons",f:"physics",t:"모든 순간의 물리학",a:"카를로 로벨리",y:"2014",s:"live",q:"현대 물리학의 핵심은 무엇인가?",tags:["시간","우주","실재"],
  card:{ans:"공간과 시간은 고정된 무대가 아니라 휘고 출렁이는 존재이며, 세계는 ‘사물’이 아니라 ‘사건과 관계’의 그물이다.",
   concepts:[["일반상대성이론","중력은 힘이라기보다 휘어진 시공간이다. 무거운 것이 공간을 휘게 하고, 다른 것은 그 휜 길을 따라 움직인다."],["양자역학","세계는 연속이 아니라 알갱이로 되어 있고, 입자는 다른 것과 관계를 맺을 때에만 모습을 드러낸다."],["시간과 열","과거와 미래가 다른 이유는 열이 뜨거운 곳에서 차가운 곳으로 흐르기 때문이다."]],
   analogy:"트램펄린 한가운데 놓인 볼링공. 그 옆에 굴린 구슬이 공 쪽으로 휘어 들어가는 것이 바로 중력이다.",
   quote:"우리는 자연을 바깥에서 바라보는 관찰자가 아니라, 자연의 일부다.",cite:"마지막 강의의 요지 · 원고 확정 시 쪽수 기입",
   thought:"이 책은 짧고 아름답지만, 루프 양자중력처럼 아직 검증되지 않은 이론도 다룬다. 확립된 이론과 저자의 연구 가설을 구분해 읽으면 좋다.",
   links:["brief-history","feynman","sophie"],
   ask:["나는 나 자신을 ‘고정된 사물’로 보는가, 관계 속에서 변하는 ‘사건’으로 보는가?","요즘 나의 시간은 빠르게 흐르는가, 느리게 흐르는가? 왜 그렇다고 느끼는가?"],
   videos:[["본편","13:48"],["쇼츠 · 휘어진 공간","0:59"],["쇼츠 · 시간은 열이다","0:44"]]}},
 {id:"brief-history",f:"physics",t:"시간의 역사",a:"스티븐 호킹",y:"1988",s:"live",q:"우주는 어떻게 시작됐고 어떻게 끝나나?",tags:["시간","우주","무한"],
  card:{ans:"호킹은 우주가 빅뱅이라는 한 점에서 시작해 팽창해 왔으며, 시간 자체도 그 시작점에서 함께 생겨났다고 — 즉 ‘빅뱅 이전’이라는 질문 자체가 성립하지 않을 수 있다고 설명한다.",

 {id:"feynman",f:"physics",t:"파인만의 여섯 가지 물리 이야기",a:"리처드 파인만",y:"1994",s:"live",q:"모든 것이 원자로 되어 있다는 게 무슨 뜻인가?",tags:["실재","우주"],
  card:{ans:"파인만은 만약 단 한 문장만 후대에 남길 수 있다면 ‘모든 것은 원자로 이루어져 있다’는 문장을 고르겠다고 했다 — 이 한 문장 안에 물리학·화학·생물학의 거의 모든 것이 압축되어 있기 때문이다.",

  card:{ans:"김상욱은 세상의 모든 존재가 저마다 떨고 있으며, 그 떨림이 다른 존재와 맞아 들어갈 때 ‘울림’(공명)이 일어난다는 물리학의 원리를, 인간이 서로 관계 맺는 방식에 대한 은유로 확장한다.",
   concepts:[["떨림 없는 존재는 없다","절대영도가 아닌 이상 모든 원자와 분자는 끊임없이 진동한다. 완전히 멈춰 있는 고요한 물질은 이 우주에 존재하지 않는다 — 존재한다는 것은 곧 떨고 있다는 것이다."],["공명(resonance)","그네를 밀 때 아무 리듬으로나 밀면 소용없지만, 그네의 고유 진동수에 맞춰 밀면 작은 힘으로도 크게 흔들린다. 관계도 상대의 리듬을 알아야 작은 노력으로 깊이 가닿을 수 있다."],["양자역학적 관계","양자역학에서 입자는 관측되기 전까지 여러 상태가 겹쳐 있다가, 다른 무언가와 관계를 맺는 순간(측정) 비로소 하나의 상태로 드러난다 — 우리의 정체성도 홀로 있을 때보다 관계 속에서 더 선명해지는지도 모른다."]],

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(path,opts={}){
  const res=await fetch(path,{method:opts.method||"GET",headers:opts.body?{"Content-Type":"application/json"}:undefined,body:opts.body?JSON.stringify(opts.body):undefined,credentials:"same-origin"});
  let data=null;try{data=await res.json()}catch(e){}
  if(!res.ok){const err=new Error((data&&data.error)||`요청에 실패했습니다 (${res.status})`);err.status=res.status;throw err}
  return data;
}

async function refreshAuth(){
  try{const data=await api("/api/me");state.user=data.user}catch(e){state.user=null}

async function loadEntries(){
  if(!state.user){state.entries=[];return}
  try{
    const data=await api("/api/responses");
    state.entries=(data.entries||[]).map(e=>({id:e.id,book:e.book_id,qi:e.question_index,text:e.answer_text,date:e.created_at.slice(0,10),pub:e.is_public}));

}

function bookTile(b){
  const F=FIELDS[b.f];const live=b.s==="live";
  const inner=`<span class="meta"><span class="pill fld">${F.name}</span><span class="pill ${live?"live":""}">${live?"공개됨":"예정"}</span></span>
   <span><span class="t">${esc(b.t)}</span><br><span class="a">${esc(b.a)} · ${esc(b.y)}</span></span>
   <span class="q">${esc(b.q)}</span>
   <span class="tag">${b.tags.map(t=>"#"+t).join(" ")}</span>`;
  return live?`<a class="book" data-f="${b.f}" href="#card-${b.id}">${inner}</a>`:`<div class="book soon" data-f="${b.f}">${inner}</div>`;
}

    <div class="blk"><h2><span class="mono">03</span>인상 깊은 문장</h2><blockquote class="quote">“${esc(c.quote)}”<cite>${esc(c.cite)}</cite></blockquote></div>
    <div class="blk"><h2><span class="mono">04</span>나의 생각과 반론</h2><div class="prose"><p>${esc(c.thought)}</p></div></div>
    <div class="ask" id="ask"><div><div class="label" style="color:var(--f)">나에게 묻는 질문</div><h2>이 책을 내 삶에 비춰 보기</h2></div>
     ${c.ask.map((q,i)=>`<div class="askq"><label for="ans-${i}">${esc(q)}</label><textarea id="ans-${i}" placeholder="떠오르는 대로 적어 보세요. 기본은 나만 보기입니다."></textarea>
      <div class="row"><label class="check"><input type="checkbox" id="pub-${i}"> 커뮤니티에 익명으로 공개</label><button class="btn primary" data-save="${i}">기록 저장</button></div><div id="msg-${i}"></div></div>`).join("")}
     ${mine.length?`<div class="note">이 책에 남긴 기록 ${mine.length}개 · <a href="#journal">나의 기록에서 보기</a></div>`:""}
    </div>
    <div class="blk"><h2><span class="mono">05</span>연결되는 책</h2><div class="grid">${c.links.map(l=>bookTile(BY[l])).join("")}</div></div>
   </article>
   <aside class="aside">
    <div class="panel"><div class="video" role="img" aria-label="유튜브 본편 썸네일 자리"><div class="play"></div><span class="dur">${c.videos[0][1]}</span></div>
     <div class="vlist">${c.videos.map(v=>`<div><span>${v[0]}</span><span class="mono">${v[1]}</span></div>`).join("")}</div>
     <a class="btn" href="https://www.youtube.com" target="_blank" rel="noopener">유튜브에서 보기</a>
     </div>
    <div class="panel"><span class="label">북카드 목차</span><div class="vlist"><div>한 줄 질문 · 답</div><div>핵심 개념 3가지</div><div>비유 · 인상 깊은 문장</div><div>나의 생각과 반론</div><div><a href="#card-${id}" data-jump="ask" style="color:var(--f);font-weight:600">나에게 묻는 질문 →</a></div></div></div>
   </aside>
  </div></div>`;
}

function viewJournal(){
  if(!state.user)return `<section style="max-width:560px"><h1 style="font-size:2em">나의 기록</h1><p style="color:var(--ink-2)">북카드의 질문에 남긴 답이 날짜순으로 이곳에 쌓입니다. 기록은 기본 비공개입니다.</p><div class="gate"><b>기록을 보려면 가입이 필요해요</b><div><button class="btn primary" data-login>가입하고 시작하기</button></div></div></section>`;
  const es=[...state.entries].sort((a,b)=>b.date.localeCompare(a.date));
  const books=new Set(es.map(e=>e.book));const fs=new Set(es.map(e=>BY[e.book].f));
  const pairs=es.filter(e=>e.book==="apology"&&e.qi===1);
  const old=pairs[pairs.length-1],now=pairs[0];
  return `<section><div class="sec-head"><div><div class="label">${esc(state.user.email)}님의 삶 적용 저널</div><h1 style="font-size:2em">나의 기록</h1></div></div>
   <div class="stats"><div><b class="mono">${es.length}</b><span>기록</span></div><div><b class="mono">${books.size}</b><span>읽은 북카드</span></div><div><b class="mono">${fs.size} / 4</b><span>다녀간 분야</span></div></div></section>
   ${es.length?"":'<p class="empty">아직 기록이 없어요. 북카드의 “나에게 묻는 질문”에 답을 남기면 여기에 쌓입니다.</p>'}
   ${old&&now&&old!==now?`<section><h2 style="font-size:1.3em">그때의 나, 지금의 나</h2><p style="margin:0;color:var(--ink-2)">같은 질문 “${esc(BY.apology.card.ask[1])}”에 대한 두 번의 답</p>
    <div class="compare"><div class="panel"><span class="mono" style="font-size:.8em;color:var(--ink-3)">${old.date}</span><div>${esc(old.text)}</div></div><div class="panel" style="border-color:var(--brand)"><span class="mono" style="font-size:.8em;color:var(--ink-3)">${now.date}</span><div>${esc(now.text)}</div></div></div></section>`:""}
   ${es.length?`<section><h2 style="font-size:1.3em">타임라인</h2><div class="timeline">${es.map(e=>{const b=BY[e.book];return `<div class="entry" data-f="${b.f}"><span class="when">${e.date} · <a href="#card-${b.id}">${esc(b.t)}</a>${e.pub?" · 공개":""}</span><span class="qq">${esc(b.card.ask[e.qi])}</span><div class="ans">${esc(e.text)}</div></div>`}).join("")}</div></section>`:""}`;
}

let connTag="시간";
function viewConnect(){
  const tags=[...new Set(BOOKS.flatMap(b=>b.tags))];
  const list=BOOKS.filter(b=>b.tags.includes(connTag));
  return `<section><div class="hub-head"><span class="label">사고의 지도</span><h1>분야 연결 특집</h1><p>하나의 개념 태그로 네 분야의 책을 가로질러 읽습니다.</p></div>
   <div class="chips" role="group" aria-label="개념 태그">${tags.map(t=>`<button class="chip" data-tag="${t}" aria-pressed="${t===connTag}">#${t}</button>`).join("")}</div>
   ${FEATURES[connTag]?`<div class="feature-intro"><span class="label">분기 특집</span><h2>#${connTag}</h2><p>${FEATURES[connTag]}</p></div>`:""}
   <div class="cols">${FORDER.map(k=>{const bs=list.filter(b=>b.f===k);return `<div class="col" data-f="${k}"><h3>${FIELDS[k].name}</h3>${bs.map(bookTile).join("")||'<div class="empty">이 태그의 책이 아직 없어요</div>'}</div>`}).join("")}</div></section>`;
}

let q="";
function viewSearch(){
  return `<section class="search"><h1 style="font-size:2em">검색</h1><label for="sq" class="label">책 제목, 저자, 개념 태그</label><input id="sq" type="search" value="${esc(q)}" placeholder="예: 로벨리, 무한, 정의"><div id="sres" class="grid"></div></section>`;
}
function renderSearch(){
  const t=q.trim().replace(/^#/,"");const r=BOOKS.filter(b=>!t||[b.t,b.a,b.q,...b.tags].join(" ").includes(t));
  const el=document.getElementById("sres");if(el)el.innerHTML=r.map(bookTile).join("")||`<p class="empty">“${esc(t)}”에 맞는 책이 없어요. 커뮤니티에서 다음 책으로 제안해 보세요.</p>`;
}

const CANDS=[["c1","시간은 흐르지 않는다","카를로 로벨리","physics"],["c2","신의 역사","카렌 암스트롱","religion"],["c3","니코마코스 윤리학","아리스토텔레스","philosophy"],["c4","코스모스","칼 세이건","physics"]];
function viewCommunity(){
  const tot=Object.values(state.votes).reduce((a,b)=>a+b,0);
  return `<section><div class="hub-head"><span class="label">유튜브 커뮤니티 탭과 같은 후보로 진행</span><h1>다음 책 투표</h1><p>다음 본편으로 다룰 책을 골라 주세요. 참여 <span class="mono">${tot}</span>명</p></div>
   <div class="vote">${CANDS.map(([id,t,a,f])=>{const v=state.votes[id];const p=Math.round(v/tot*100);return `<button class="vopt" data-f="${f}" data-vote="${id}" aria-pressed="${state.myVote===id}"><span class="vtop"><span><b>${t}</b> <span class="a" style="color:var(--ink-3);font-size:.85em">${a} · ${FIELDS[f].name}</span></span><span class="mono">${p}%</span></span><span class="vbar"><i style="width:${p}%"></i></span></button>`}).join("")}</div>
   ${state.myVote?'<p class="note" style="margin:0">투표했어요. 다시 누르면 다른 책으로 바꿀 수 있습니다.</p>':""}</section>
   <section><h2 style="font-size:1.3em">공개된 답</h2><div id="pubFeed" class="empty">불러오는 중…</div></section>`;
}
async function renderPublicFeed(){
  const el=document.getElementById("pubFeed");if(!el)return;
  try{
    const data=await api("/api/responses/public");
    const pub=data.entries||[];
    el.className=pub.length?"timeline":"empty";
    el.innerHTML=pub.length?pub.map(e=>{const b=BY[e.book_id];if(!b||!b.card)return"";return `<div class="entry" data-f="${b.f}"><span class="when">익명 · ${esc(e.created_at.slice(0,10))} · ${esc(b.t)}</span><span class="qq">${esc(b.card.ask[e.question_index]||"")}</span><div class="ans">${esc(e.answer_text)}</div></div>`}).join(""):'<p class="empty">아직 공개된 답이 없어요. 북카드에서 답을 저장할 때 ‘익명으로 공개’를 선택하면 여기에 나타납니다.</p>';
  }catch(err){
    el.className="empty";el.textContent="공개된 답을 불러오지 못했어요.";
  }
}

function route(){
  const h=(location.hash||"#home").slice(1);let html,cur=h;
  if(FIELDS[h])html=viewHub(h);
  else if(h.startsWith("card-")){html=viewCard(h.slice(5));cur=BY[h.slice(5)]?.f}
  else if(h.startsWith("connect")){const m={time:"시간",infinity:"무한",truth:"진리"}[h.split("-")[1]];if(m)connTag=m;html=viewConnect();cur="connect"}
  else if(h==="journal")html=viewJournal();
  else if(h==="community")html=viewCommunity();
  else if(h==="search")html=viewSearch();
  else{html=viewHome();cur="home"}
  document.getElementById("app").innerHTML=html;
  document.getElementById("nav").innerHTML=NAV.map(([k,l])=>`<a href="#${k}" ${k===cur?'aria-current="page"':""}>${l}</a>`).join("");
  document.getElementById("authBtn").textContent=state.user?"로그아웃":"가입하기";
  if(h==="search"){renderSearch();const i=document.getElementById("sq");i.addEventListener("input",e=>{q=e.target.value;renderSearch()})}
  if(h==="community")renderPublicFeed();
}
function rerender(keepScroll){const y=scrollY;route();if(keepScroll)scrollTo(0,y)}

async function saveAnswer(i){
  const box=document.getElementById("ans-"+i);const msg=document.getElementById("msg-"+i);
  if(!box)return;
  const text=box.value.trim();
  if(!text){if(msg)msg.innerHTML='<span class="note" style="color:var(--phy)">답을 한 줄 이상 적어 주세요.</span>';box.focus();return}
  if(!state.user){
    if(msg)msg.innerHTML='<div class="gate"><b>답을 저장하려면 가입이 필요해요</b><span>적은 내용은 그대로 남아 있어요. 가입하면 바로 저장됩니다.</span><div><button type="button" class="btn primary" data-login-save="'+i+'">가입하고 저장하기</button></div></div>';
    return;
  }
  const bookId=location.hash.slice(6);
  const isPublic=document.getElementById("pub-"+i)?.checked||false;
  if(msg)msg.textContent="저장 중...";
  try{
    const data=await api("/api/responses",{method:"POST",body:{book_id:bookId,question_index:i,answer_text:text,is_public:isPublic}});
    state.entries.unshift({id:data.entry.id,book:bookId,qi:i,text,date:data.entry.created_at.slice(0,10),pub:isPublic});
    box.value="";
    if(msg)msg.innerHTML='<span class="note">저장했어요. <a href="#journal">나의 기록</a>에서 볼 수 있습니다.</span>';
  }catch(err){
    if(msg)msg.innerHTML=`<span class="note" style="color:var(--phy)">${esc(err.message)}</span>`;
  }
}

let authMode="signup",pendingSaveIndex=null;
const authOverlay=document.getElementById("authOverlay");
function openAuth(mode,pendingIndex){
  authMode=mode||"signup";
  pendingSaveIndex=pendingIndex===undefined?null:pendingIndex;
  authOverlay.querySelectorAll("[data-authmode]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.authmode===authMode)));
  document.getElementById("authTitle").textContent=authMode==="signup"?"가입하기":"로그인";
  document.getElementById("authNewsletterWrap").hidden=authMode!=="signup";
  document.getElementById("authMsg").textContent="";
  document.getElementById("authForm").reset();
  authOverlay.hidden=false;
  document.getElementById("authEmail").focus();
}
function closeAuth(){authOverlay.hidden=true;pendingSaveIndex=null}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-hub],[data-tag],[data-save],[data-login],[data-login-save],[data-vote],[data-jump]");if(!t)return;
  if(t.dataset.hub){hubFilter=t.dataset.hub;rerender(true)}
  else if(t.dataset.tag){connTag=t.dataset.tag;rerender(true)}
  else if(t.dataset.jump){e.preventDefault();document.getElementById(t.dataset.jump)?.scrollIntoView({behavior:"smooth"})}
  else if(t.hasAttribute("data-login")){openAuth("signup",null)}
  else if(t.dataset.loginSave!==undefined){openAuth("signup",+t.dataset.loginSave)}
  else if(t.dataset.vote){const id=t.dataset.vote;if(state.myVote)state.votes[state.myVote]--;state.votes[id]++;state.myVote=id;save();rerender(true)}
  else if(t.dataset.save!==undefined){saveAnswer(+t.dataset.save)}
});
authOverlay.querySelectorAll("[data-authmode]").forEach(b=>b.addEventListener("click",()=>openAuth(b.dataset.authmode,pendingSaveIndex)));
document.getElementById("authCancel").addEventListener("click",closeAuth);
authOverlay.addEventListener("click",e=>{if(e.target===authOverlay)closeAuth()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!authOverlay.hidden)closeAuth()});
document.getElementById("authForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const email=document.getElementById("authEmail").value.trim();
  const password=document.getElementById("authPassword").value;
  const newsletter=document.getElementById("authNewsletter").checked;
  const msg=document.getElementById("authMsg");
  msg.textContent="처리 중...";
  try{
    const path=authMode==="signup"?"/api/signup":"/api/login";
    const body=authMode==="signup"?{email,password,newsletter}:{email,password};
    const data=await api(path,{method:"POST",body});
    state.user=data.user;
    await loadEntries();
    closeAuth();
    const pending=pendingSaveIndex;pendingSaveIndex=null;
    if(pending!==null){await saveAnswer(pending);document.getElementById("authBtn").textContent="로그아웃"}
    else rerender(true);
  }catch(err){
    msg.innerHTML=`<span class="note" style="color:var(--phy)">${esc(err.message)}</span>`;
  }
});

document.addEventListener("submit",e=>{if(e.target.id==="newsForm"){e.preventDefault();document.getElementById("newsMsg").textContent="구독 신청이 접수됐어요.";e.target.querySelector("input").value=""}});
document.getElementById("authBtn").addEventListener("click",async()=>{
  if(state.user){
    try{await api("/api/logout",{method:"POST"})}catch(err){}
    state.user=null;state.entries=[];rerender(true);
  }else openAuth("signup",null);
});
const bigBtn=document.getElementById("bigBtn");
function setBig(v){document.documentElement.classList.toggle("big",v);bigBtn.setAttribute("aria-pressed",v);store.set("big",v)}
bigBtn.addEventListener("click",()=>setBig(!document.documentElement.classList.contains("big")));

(async function init(){
  setBig(store.get("big",false));
  await refreshAuth();
  await loadEntries();
  route();
  window.addEventListener("hashchange",()=>{route();scrollTo(0,0)});
})();
</script>

</body></html>
